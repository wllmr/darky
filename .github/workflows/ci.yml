name: Check and package

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install developer tools
        run: npm ci
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Run all checks
        run: npm run test:all
      - name: Build release files
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            npm run build -- --tag "$GITHUB_REF_NAME"
          else
            npm run build
          fi
      - name: Save installable ZIP and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: darky-release
          path: |
            dist/darky.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  release:
    name: Prepare draft GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: darky-release
          path: dist
      - name: Verify downloaded build
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Create or refresh a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if existing=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$existing" != "true" ]]; then
              echo "Refusing to replace assets on a published release. Use a new version tag."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist/darky.zip dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" dist/darky.zip dist/SHA256SUMS \
              --verify-tag --draft --title "Darky $RELEASE_TAG" \
              --notes-file .github/release-notes.md
          fi
